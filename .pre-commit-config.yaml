default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-executables-have-shebangs
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff-format
      - id: ruff
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
  - repo: local
    hooks:
      - id: git-guard-tests
        name: git guard hook tests
        entry: python3 .claude/hooks/test_git_guard.py
        language: system
        files: ^\.claude/hooks/
        pass_filenames: false
      - id: check-script-tests
        name: constrain-check script tests
        entry: python3 jy-repo-constrain-check/scripts/test_check.py
        language: system
        files: ^jy-repo-constrain-check/scripts/
        pass_filenames: false
      - id: review-gate-tests
        name: review gate tests
        entry: python3 scripts/test_review_gate.py
        language: system
        files: ^scripts/(test_)?review_gate\.py$
        pass_filenames: false
      - id: review-gate
        name: review gate (3 Claude reviewers, >=2 approve)
        entry: python3 scripts/review_gate.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
