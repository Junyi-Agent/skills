name: 建议
description: 新的 skill、检查项或规则，或者改变现有行为
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: 维护者打上 `accepted` 后，维护 loop 会先写一篇 ADR 提议，维护者打 `approved` 后才实现。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议怎么做
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
